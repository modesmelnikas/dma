services:
  - type: web
    name: dma
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: BOARD_OBRAS
        value: "5107838007"
      - key: BOARD_PERSONAL
        value: "5107838012"
      - key: BOARD_REGISTROS
        value: "5107838013"
      - key: BOARD_CLIENTES
        value: "5107839069"
      - key: MONDAY_API_TOKEN
        sync: false
      - key: INITIAL_ADMIN_USER
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: INITIAL_ADMIN_NAME
        sync: false
